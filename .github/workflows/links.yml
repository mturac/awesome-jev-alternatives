name: links

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and GitHub activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_links
      - name: awesome-lint
        run: npx --yes awesome-lint
